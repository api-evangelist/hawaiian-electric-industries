note: >-
  Recorded so the absence is legible rather than untested. Hawaiian Electric Industries publishes
  no API versioning policy, no deprecation policy, no SLA and no developer status page. No
  StatusPage or Deprecation pointer is emitted, because there is nothing to point at.
versioning:
  policy_url: null
  scheme: vendor-controlled
  current_version: '12'
  detail: >-
    `currentVersion: 12` is Esri's ArcGIS Online platform version reported by the service root,
    not a Hawaiian Electric API version a caller can pin. There is no version segment in the path
    and no documented compatibility commitment. Environment is carried in the service NAME
    instead — extLVM vs extLVM_tst vs extLVM_dev — with nothing in the metadata marking which is
    production.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  detail: >-
    No deprecation policy, no Sunset or Deprecation response headers observed, and no changelog.
    A layer can be unshared or renamed without notice; the only signal a consumer would get is a
    query that starts returning {"error":{"code":400}} with HTTP 200.
