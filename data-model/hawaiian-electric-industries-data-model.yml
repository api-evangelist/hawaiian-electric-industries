relationship_note: >-
  Every service reports relationships: [] and no field carries a foreign key. ExternalLVMData,
  GridNeeds_HECO and HECO_EV_Stations are joined only by geography (overlapping polygons /
  contained points) and by the operating-utility suffix in the service name — HECO (Oahu),
  HELCO (Hawaii Island), MECO (Maui County). Recording a has_many here would be an invention.
data_quality_notes:
  - >-
    Seven HECO_EV_Stations fields carry truncated 10-character names (Charger_Fe, Hours_of_O,
    Charger_De, Charger__1, Payment_Op, Charging_S) — the layer was published from a shapefile
    and the original column names are not recoverable from the service metadata.
  - >-
    MWNeed, YearofNeed and CertaintyRating are typed as strings, not numerics, so a consumer must
    parse them.
  - >-
    Test and development services (extLVM_tst, extLVM_dev, GridNeeds_*_tst, PSPS_Zoom_tst_export_gdb)
    are publicly shared alongside production in the same catalog, with no field marking which is which.
