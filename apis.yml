aid: hawaiian-electric-industries
name: Hawaiian Electric Industries
description: 'Hawaiian Electric Industries (HEI) is a Honolulu-based holding company whose principal subsidiary,
  Hawaiian Electric, delivers electricity to roughly 95% of Hawaii''s residents through three operating
  utilities — Hawaiian Electric (Oahu), Hawaii Electric Light (Hawaii Island) and Maui Electric (Maui
  County) — alongside Pacific Current, its clean-energy and sustainability investment arm. HEI runs no
  developer program and publishes no OpenAPI, SDK or MCP server. It does serve one real, anonymously callable
  machine-readable surface: a public Esri ArcGIS REST feature-service catalog carrying the Locational
  Value Maps, published grid needs and EV charging locations that its own hawaiianelectric.com map applications
  consume.'
