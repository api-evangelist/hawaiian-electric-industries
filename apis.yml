apis:
- name: Hawaiian Electric Grid Data (ArcGIS REST Feature Services)
  description: 'The public Esri ArcGIS Online feature-service catalog Hawaiian Electric serves under tenant
    gfBpz2hbsVDgru6D. Twenty-three FeatureServers are shared publicly and answer anonymous queries: the
    External Locational Value Map layers (extLVM, extLVM_HELCO, extLVM_MECO) that report available hosting
    capacity, DG penetration bands and pre-approval eligibility per service address; the published GridNeeds
    layers (HECO/HELCO/MECO) carrying need, MW, year and certainty rating; HECO_EV_Stations; and EV-load,
    alternative-fuel and ALICE datasets. Every service is capabilities: Query — read-only — and returns
    JSON, GeoJSON, CSV, KML, GeoPackage and shapefile. These exact URLs are loaded by Hawaiian Electric''s
    own map application at www.hawaiianelectric.com/prebuilt/external_lvm/, which is how the tenant is
    attributed to this company.'
